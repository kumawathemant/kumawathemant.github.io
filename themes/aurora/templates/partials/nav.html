<header class="nav" data-nav>
  <div class="nav-inner">
    <a class="brand" href="{{ url('/') }}" aria-label="{{ site.name }}, home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--mint)"/><stop offset="1" style="stop-color:var(--indigo)"/></linearGradient></defs>
        <ellipse cx="16" cy="16" rx="12.5" ry="5.6" fill="none" stroke="url(#bm)" stroke-width="1.8" transform="rotate(-32 16 16)"/>
        <circle cx="16" cy="16" r="3.4" fill="url(#bm)"/>
        <circle class="brand-orbit" cx="26.4" cy="9.6" r="2.1" style="fill:var(--amber)"/>
      </svg>
      <span class="brand-name">{{ site.name }}</span>
    </a>
    <nav class="nav-links" id="nav-links" aria-label="Primary">
      <span class="nav-pill" aria-hidden="true"></span>
      {% for item in nav %}
      <a href="{{ item.href }}" data-section="{{ item.id }}"{% if page == 'blog' and item.id == 'writing' %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
    <div class="nav-tools">
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch color theme" title="Switch theme">{{ icon('sun', 'i-sun') }}{{ icon('moon', 'i-moon') }}</button>
      <a class="btn btn-primary btn-sm nav-cv" href="{{ site.cv }}">{{ icon('download') }}<span>CV</span></a>
      <button class="icon-btn menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">{{ icon('menu', 'i-menu') }}{{ icon('close', 'i-close') }}</button>
    </div>
  </div>
</header>
