<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ site.name }} — {{ site.now.role }} at {{ site.now.org }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<meta name="author" content="{{ site.name }}">
<link rel="canonical" href="{{ site.url }}{{ page_url }}">
{% if is_draft %}<meta name="robots" content="noindex">{% endif %}
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07090d">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ site.url }}{{ page_url }}">
<meta property="og:image" content="{{ site.url }}/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@HeMan553">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="alternate" type="application/atom+xml" title="{{ site.name }} — Writing" href="/blog/feed.xml">
<script>
  (function () {
    var d = document.documentElement, t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    d.dataset.theme = t;
    d.classList.add('js');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="{{ theme_asset('site.css') }}">
<noscript><style>.pub-panel{grid-template-rows:1fr!important}.authors-more{display:inline!important}.authors-toggle{display:none}</style></noscript>
{% block head %}{% endblock %}
</head>
<body class="page-{{ page }}">
<a class="skip-link" href="#main">Skip to content</a>
<div class="progress" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
{% include "partials/nav.html" %}
<main id="main">
{% block content %}{% endblock %}
</main>
{% include "partials/footer.html" %}
<div class="toast" role="status" aria-live="polite"></div>
<script src="{{ asset('js/site.js') }}" defer></script>
{% block scripts %}{% endblock %}
{{ live_reload }}
</body>
</html>
