about:
  title: "Agents that *model the world* — and act in it."
  paragraphs:
    - >-
      I'm an Applied Scientist on the **Gaming AI** team at **Microsoft** in Seattle. I build efficient,
      real-time vision-language models that understand gameplay — powering adaptive, context-aware game
      assistance and persistent player profiles behind recaps and recommendations — along with evaluation
      pipelines that catch hallucinations and failure points in **Microsoft Copilot** conversations.
    - >-
      My research asks how agents can learn models of the world that are compact enough to run in real
      time, rich enough to plan with, and honest about what they can't observe — and how to turn
      multimodal foundation models into agents that act, in games and on robots. I did my M.S. and Ph.D.
      in ECE at **Georgia Tech**, advised by
      [Prof. Saibal Mukhopadhyay](https://ece.gatech.edu/directory/saibal-mukhopadhyay), on control-ready
      world models, multi-agent forecasting with hidden agents, and closed-loop perception.
    - >-
      Along the way I interned at **Qualcomm** (3D occupancy world models), **Amazon Robotics**
      (multi-agent forecasting for warehouse fleets) and the **CMU Robotics Institute** (evasive maneuver
      planning), and before that led IIT Bombay's self-driving car team, **SeDriCa**.
