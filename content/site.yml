about:
  title: "Closing the loop between *perception*, *prediction* and *control*."
  paragraphs:
    - >-
      I'm an Applied Scientist on the **Gaming AI** team at **Microsoft** in Seattle. I build efficient,
      real-time vision-language models that understand gameplay — powering adaptive, context-aware game
      assistance and persistent player profiles behind recaps and recommendations — along with evaluation
      pipelines that catch hallucinations and failure points in **Microsoft Copilot** conversations.
    - >-
      I did my M.S. and Ph.D. in ECE at **Georgia Tech**, advised by
      [Prof. Saibal Mukhopadhyay](https://ece.gatech.edu/directory/saibal-mukhopadhyay). My research
      develops compositional and causal models that bridge perception, prediction and control: compact,
      task-conditioned representations for decision-making, forecasting of multi-agent systems in which
      some agents are never observed, and closed-loop perception that adapts what it senses to what the
      task needs.
    - >-
      Along the way I interned at **Qualcomm** (3D occupancy world models), **Amazon Robotics**
      (multi-agent forecasting for warehouse fleets) and the **CMU Robotics Institute** (evasive maneuver
      planning), and before that led IIT Bombay's self-driving car team, **SeDriCa**.
  glance:
    - label: Now
      value: Applied Scientist, Gaming AI · Microsoft
    - label: Ph.D.
      value: ECE, Georgia Tech · 2021–2025
    - label: B.Tech
      value: Mechanical Eng. & Computer Science · IIT Bombay · 2016–2020
    - label: Based in
      value: Seattle, WA
  interests:
    - Multimodal foundation models
    - Vision-language-action models
    - World models
    - Robot learning & RL
    - Multi-agent forecasting
    - Efficient perception
    - Sensor fusion

# Research threads: each gets an animated figure (viz: flow | koopman | agents | lidar | tokens | events | chirp)
threads:
  - key: control
    emoji: "🎛️"
    color: mint
    viz: koopman
    kicker: representations for control
    title: Compact representations for decision-making
    text: >-
      Agents act better when their latent space is built for the task. I learn control-conditioned
      representations — Koopman embeddings where nonlinear dynamics become linear, causal decision
      transformers that credit only the features that matter, and state-space agents for event streams.
    caption: "Koopman lifting — tangled orbits in observation space become clean rotations in the latent space, where a linear controller suffices."
    legend: "hover to scrub"
    papers: [robokoop, adacred, maple]
  - key: agents
    emoji: "🕸️"
    color: indigo
    viz: agents
    kicker: multi-agent dynamics
    title: Forecasting interacting agents under partial observability
    text: >-
      Real systems are never fully observed. I build stochastic generative graph models — temporal
      manifolds, spatiotemporal graph attention and neural ODEs — that infer hidden agents and their
      interactions from the agents we can see.
    caption: "Spring-coupled agents. Hollow nodes are never observed; their positions and interactions are inferred. Dotted paths are forecasts."
    legend: "drag an agent"
    papers: [stemfold, stagenet, sdgn]
  - key: perception
    emoji: "📡"
    color: amber
    viz: lidar
    kicker: closed-loop perception
    title: Perception that decides what to sense
    text: >-
      Sensing everything everywhere wastes compute and power. My work lets cheap sensors guide expensive
      ones — radar-proposed regions of interest, task-driven LiDAR sampling, per-chirp radar processing and
      fully-sparse LiDAR detectors for low-compute autonomy.
    caption: "Radar returns propose regions of interest; the LiDAR sweep samples densely inside them and sparsely everywhere else."
    legend: "live sweep"
    papers: [radar-attention, rgb-lidar-fusion, chirpnet, dfdnet]
  - key: foundation
    emoji: "🎮"
    color: rose
    viz: tokens
    kicker: foundation & world models
    title: Multimodal models that understand worlds — real and virtual
    text: >-
      Today I build real-time vision-language models for game understanding at Microsoft, and previously
      designed object-centric 3D occupancy world models with sparse, trackable Gaussian queries at Qualcomm.
      The common thread: efficient multimodal models that turn pixels into state an agent can use.
    caption: "Patch attention follows the entities that matter while a compact state description is decoded token by token."
    legend: "illustrative"
    papers: []
    chips:
      - label: Gaming AI @ Microsoft
        href: "#exp-microsoft"
      - label: 3D occupancy @ Qualcomm
        href: "#exp-qualcomm"

