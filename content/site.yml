# Short bio for the homepage intro — two sentences, so visitors reach the research quickly
intro: >-
  I'm an Applied Scientist on Microsoft's **Gaming AI** team, building real-time vision-language models
  that understand gameplay. My research asks how agents can learn **world models** — compact enough to
  run in real time, rich enough to plan with, honest about what they can't see — and how to turn
  **multimodal foundation models** into agents that act, in games and on robots. Ph.D. from
  **Georgia Tech** with [Prof. Saibal Mukhopadhyay](https://ece.gatech.edu/directory/saibal-mukhopadhyay);
  internships at **Qualcomm**, **Amazon Robotics** and **CMU**.

