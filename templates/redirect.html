<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<link rel="canonical" href="{{ site.url }}{{ target }}">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{ target }}">
<script>location.replace({{ target | tojson }});</script>
</head>
<body><p>This page moved to <a href="{{ target }}">{{ site.url }}{{ target }}</a>.</p></body>
</html>
