{# Floating draft switcher — injected into every page when drafts are built (dev preview only). #}
{% set cur = themes | selectattr("key", "equalto", current) | first %}
<div class="dsw" data-dsw>
<style>
  .dsw{all:initial;position:fixed;left:16px;bottom:16px;z-index:2147483000;font:500 13px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
  .dsw *{box-sizing:border-box;font:inherit;color:inherit;margin:0}
  .dsw-btn{display:flex;align-items:center;gap:9px;padding:9px 14px 9px 11px;border-radius:999px;background:rgba(18,18,20,.9);border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 32px -12px rgba(0,0,0,.55);cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .dsw-btn:hover{background:rgba(32,32,36,.95)}
  .dsw-dot{width:8px;height:8px;border-radius:50%;background:#00c832;box-shadow:0 0 0 3px rgba(0,200,50,.25)}
  .dsw-caret{opacity:.6;font-size:11px}
  .dsw-menu{position:absolute;left:0;bottom:calc(100% + 10px);width:320px;padding:6px;border-radius:16px;background:rgba(18,18,20,.97);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);display:none}
  .dsw.open .dsw-menu{display:block}
  .dsw-menu a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;cursor:pointer}
  .dsw-menu a:hover,.dsw-menu a[aria-current]{background:rgba(255,255,255,.09)}
  .dsw-menu a[aria-current]::after{content:"current";float:right;font-size:10.5px;opacity:.55;padding-top:2px}
  .dsw-menu small{display:block;margin-top:3px;font-size:11.5px;font-weight:400;color:rgba(255,255,255,.55)}
  .dsw-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 6px;border-top:1px solid rgba(255,255,255,.08);margin-top:4px;font-size:11.5px;color:rgba(255,255,255,.55)}
  .dsw-foot a{display:inline;padding:0;color:#fff}
  .dsw-foot a:hover{background:none;text-decoration:underline}
  @media (max-width:720px){.dsw{left:10px;bottom:10px}.dsw-btn{padding:7px 11px 7px 9px;font-size:12px}.dsw-menu{width:min(320px,calc(100vw - 20px))}}
  @media print{.dsw{display:none}}
</style>
<div class="dsw-menu" role="menu" aria-label="Design drafts">
  {% for t in themes %}
  <a role="menuitem" href="/drafts/{{ t.key }}{{ page_url }}"{% if t.key == current and base %} aria-current="page"{% endif %}>Draft {{ t.draft }} · {{ t.label }}<small>{{ t.tagline }}</small></a>
  {% endfor %}
  <div class="dsw-foot"><a href="/drafts/">compare all →</a><span>press [ or ] to flip</span></div>
</div>
<button class="dsw-btn" type="button" aria-haspopup="menu" aria-expanded="false"><span class="dsw-dot"></span>{% if base %}Draft {{ cur.draft }} · {{ cur.label }}{% else %}Live · {{ cur.label }}{% endif %}<span class="dsw-caret">▲</span></button>
<script>
(() => {
  const root = document.currentScript.closest('[data-dsw]');
  const btn = root.querySelector('.dsw-btn');
  const toggle = (open) => { root.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); };
  btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(!root.classList.contains('open')); });
  document.addEventListener('click', (e) => { if (!root.contains(e.target)) toggle(false); });
  const keys = {{ themes | map(attribute="key") | list | tojson }};
  const cur = keys.indexOf({{ current | tojson }});
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || /^(input|textarea|select)$/i.test(document.activeElement?.tagName || '')) return;
    if (e.key !== '[' && e.key !== ']') return;
    const next = keys[(cur + (e.key === ']' ? 1 : keys.length - 1)) % keys.length];
    location.href = '/drafts/' + next + {{ page_url | tojson }} + location.hash;
  });
})();
</script>
</div>
